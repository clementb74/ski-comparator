version: 2

models:
  - name: dim_stations
    description: "Dimension station de ski"
    columns:
      - name: station_id
        tests:
          - not_null
          - unique

  - name: fct_enneigement_quotidien
    description: "Faits enneigement/météo quotidiens par station"
    columns:
      - name: station_id
        tests:
          - not_null
          - unique

  - name: mart_score_qualite_neige
    description: "Score de qualité neige par station (NULL hors-saison, pas de donnée d'enneigement)"
    columns:
      - name: station_id
        tests:
          - not_null
          - unique
      - name: score_qualite_neige
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
